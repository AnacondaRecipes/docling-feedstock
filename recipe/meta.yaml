{% set name = "docling" %}
{% set version = "2.146.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/d/docling-slim/docling_slim-{{ version }}.tar.gz
    sha256: 4e0f63c4bd73a3ceb39bbfdb7abf946ae27338c372279e27b884fd82d38c2b5c
    folder: docling_slim
  # metapackage - included for accurate pip check
  - url: https://pypi.org/packages/source/d/docling-client/docling_client-{{ version }}.tar.gz
    sha256: 3b6df6330744c57741fe03ac2fe390e7ad01b5cf1e02deb6ece6ff580c0cabb5
    folder: docling_client
  # metapackage - included for accurate pip check
  - url: https://pypi.org/packages/source/d/docling/docling-{{ version }}.tar.gz
    sha256: acd3f1901afbb4bf22183e036c6794e7b5fb01c5f3d273b2631c747d49f6b3eb
    folder: docling
    patches:
      - patches/docling-drop-redeclared-entry-points.patch

build:
  number: 0
  skip: true  # [py<310]

outputs:
  - name: docling-slim
    build:
      script: python -m pip install ./docling_slim -vv --no-deps --no-build-isolation # analint: wrong_output_script_key
      entry_points:
        - docling = docling.cli.main:app
        - docling-tools = docling.cli.tools:app
    requirements:
      host:
        - python
        - pip
        - hatchling
      run:
        # Minimal base dependencies (pyproject.toml [project] dependencies)
        - python
        - pydantic >=2.0.0,<3.0.0
        - docling-core >=2.103.1,<3.0.0
        - pydantic-settings >=2.3.0,<3.0.0
        - filetype >=1.2.0,<2.0.0
        - requests >=2.32.2,<3.0.0
        - certifi >=2024.7.4
        - pluggy >=1.0.0,<2.0.0
        - tqdm >=4.65.0,<5.0.0
        - langcodes >=3.5.0,<4.0.0
      run_constrained:
        # matching docling
        # models-local, format-iwork
        - docling-ibm-models >=4.0.2,<5
        - pytorch >=2.2.2,<3.0.0 # analint: cbc_dep_in_run_missing_from_host
        - torchvision >=0,<1
        - accelerate >=1.0.0,<2
        - huggingface_hub >=0.23,<3
        - defusedxml >=0.7.1,<0.8.0
        # format-pdf (pypdfium2 + docling-parse backends)
        - pypdfium2 >=4.30.0,!=4.30.1,<6.0.0
        - docling-parse >=7.22.2,<8.0.0
        # convert-core (+ extract-core)
        - numpy >=1.24.0,<3.0.0
        - pillow >=10.0.0,<14.0.0
        - rtree >=1.3.0,<2.0.0
        - scipy >=1.9.0,<2.0.0
        - polyfactory >=2.22.2
        # feat-ocr-rapidocr
        - rapidocr >=3.9.1,<4.0.0
        # format-office, format-latex
        - python-docx >=1.2.0,<2.0.0
        - python-pptx >=1.0.2,<2.0.0
        - openpyxl >=3.1.5,<4.0.0
        - pylatexenc >=2.10,<3.0
        # format-web
        - beautifulsoup4 >=4.12.3,<5.0.0
        - marko >=2.1.2,<3.0.0
        # format-email
        - mail-parser >=4.1.4,<5.0.0
        - python-oxmsg >=0.0.2,<0.1.0
        # feat-chunking (docling-core[chunking])
        - docling-core-with-chunking >=2.103.1,<3.0.0
        # service-client + cli
        - httpx >=0.28,<1.0.0
        - websockets >=14.0,<18.0
        - typer >=0.19.0,<0.28.0
        - rich >=13.0.0
        - python-dotenv >=1.0,<2

        # matching docling[all]
        # models-vlm-inline
        - transformers >=4.42.0,<6.0.0,!=5.0.*,!=5.1.*,!=5.2.*,!=5.3.*,!=5.9.*,!=5.10.*,!=5.11.*,!=5.12.*,!=5.13.*,!=5.14.*,!=5.15.*  # [osx]
        - transformers >=4.42.0,<6.0.0,!=5.0.*,!=5.1.*,!=5.2.*,!=5.3.*,!=5.13.0  # [not osx]
        - accelerate >=1.2.1,<2.0.0
        - einops >=0.8.1,<1.0.0
        - open-clip-torch >=3.2.0,<4.0.0
        - timm >=1.0.22,<2.0.0
        - mlx-vlm >=0.7.0,<1.0.0 # [osx and arm64]
        - qwen-vl-utils>=0.0.11
        - peft >=0.18.1
        # format-audio
        - mlx-whisper >=0.4.3 # [osx and arm64]
        - openai-whisper >=20250625
        - numba >=0.63.0
        - whisper-s2t-reborn >=1.8.0,<2.0.0 # [osx and arm64]
        # format-html-render
        - playwright >=1.58.0
        # format-xml-jats
        - lxml >=4.0.0,<7.0.0
        # format-xml-uspto
        - defusedxml >=0.7.1,<0.8.0
        # format-xml-xbrl
        - arelle-release >=2.38.17,<3.0.0
        # models-remote
        - tritonclient >=2.65.0,<3.0.0
        # models-onnxruntime
        - onnxruntime >=1.24.1,<2.0.0
        # feat-ocr-easyocr
        - easyocr >=1.7,<2.0
        # feat-ocr-tesserocr
        - tesserocr >=2.7.1,<3.0.0
        - pandas >=2.1.4,<4.0.0
        # feat-ocr-mac
        - ocrmac >=1.0.0,<2.0.0 # [osx]
        # format-opendocument
        - odfdo >=3.22.0,<4.0.0
    test:
      requires:
        - pip
      imports:
        - docling
        - docling.datamodel.base_models
        - docling.datamodel.settings
        - docling.utils.text_decoding
        - docling.utils.utils
      files:
        - test/run_docling_slim_test.py
      commands:
        - pip check
        - python test/run_docling_slim_test.py

  # docling is `docling-slim[service-client]`
  # https://github.com/docling-project/docling/blob/main/packages/docling/pyproject.toml
  - name: docling-client
    build:
      script: python -m pip install ./docling_client -vv --no-deps --no-build-isolation # analint: wrong_output_script_key
    requirements:
      host:
        - python
        - pip
        - hatchling
      run:
        - python
        - {{ pin_subpackage('docling-slim', exact=True) }}
        # service-client + cli
        - httpx >=0.28,<1.0.0
        - websockets >=14.0,<18.0
        - typer >=0.19.0,<0.28.0
        - rich >=13.0.0
        - python-dotenv >=1.0,<2
    test:
      requires:
        - pip
      imports:
        - docling
        - docling.cli.main
        - docling.cli.tools
        - docling.service_client.client
      files:
        - test/run_docling_client_test.py
      commands:
        - pip check
        - docling --help
        - docling-tools --help
        - python test/run_docling_client_test.py
  
  # docling is `docling-slim[standard]`
  # https://github.com/docling-project/docling/blob/main/packages/docling/pyproject.toml
  - name: docling
    build:
      script: python -m pip install ./docling -vv --no-deps --no-build-isolation # analint: wrong_output_script_key
    requirements:
      host:
        - python
        - pip
        - hatchling
      run:
        - python
        - {{ pin_subpackage('docling-slim', exact=True) }}
        # models-local, format-iwork
        - docling-ibm-models >=4.0.2,<5
        - pytorch >=2.2.2,<3.0.0 # analint: cbc_dep_in_run_missing_from_host
        - torchvision >=0,<1
        - accelerate >=1.0.0,<2
        - huggingface_hub >=0.23,<3
        - defusedxml >=0.7.1,<0.8.0
        # format-pdf (pypdfium2 + docling-parse backends)
        - pypdfium2 >=4.30.0,!=4.30.1,<6.0.0
        - docling-parse >=7.22.2,<8.0.0
        # convert-core (+ extract-core)
        - numpy >=1.24.0,<3.0.0
        - pillow >=10.0.0,<14.0.0
        - rtree >=1.3.0,<2.0.0
        - scipy >=1.9.0,<2.0.0
        - polyfactory >=2.22.2
        # feat-ocr-rapidocr
        - rapidocr >=3.9.1,<4.0.0
        # format-office, format-latex
        - python-docx >=1.2.0,<2.0.0
        - python-pptx >=1.0.2,<2.0.0
        - openpyxl >=3.1.5,<4.0.0
        - pylatexenc >=2.10,<3.0
        # format-web
        - beautifulsoup4 >=4.12.3,<5.0.0
        - marko >=2.1.2,<3.0.0
        # format-email
        - mail-parser >=4.1.4,<5.0.0
        - python-oxmsg >=0.0.2,<0.1.0
        # feat-chunking (docling-core[chunking])
        - docling-core-with-chunking >=2.103.1,<3.0.0
        # service-client + cli
        - httpx >=0.28,<1.0.0
        - websockets >=14.0,<18.0
        - typer >=0.19.0,<0.28.0
        - rich >=13.0.0
        - python-dotenv >=1.0,<2
    test:
      requires:
        - pip
      imports:
        - docling
        - docling.chunking
        - docling.document_converter
        - docling.document_extractor
        - docling.pipeline.simple_pipeline
        - docling.pipeline.standard_pdf_pipeline
        - docling.backend.docling_parse_backend
        - docling.backend.pypdfium2_backend
        - docling.backend.msword_backend
        - docling.backend.mspowerpoint_backend
        - docling.backend.msexcel_backend
        - docling.backend.html_backend
        - docling.backend.md_backend
        - docling.models.factories.layout_factory
        - docling.models.factories.ocr_factory
        - docling.models.factories.table_factory
        - docling.models.stages.layout.layout_model
        - docling.models.stages.ocr.auto_ocr_model
        - docling.models.stages.table_structure.table_structure_model
        - docling.utils.model_downloader
        - docling.utils.visualization
        - docling.cli.main
        - docling.cli.tools
        - docling.service_client.client
      files:
        - test/run_docling_test.py
      commands:
        - pip check
        - docling --help
        - docling-tools --help
        - python test/run_docling_test.py

about:
  home: https://github.com/docling-project/docling
  doc_url: https://docling-project.github.io/docling
  dev_url: https://github.com/docling-project/docling
  license: MIT
  license_family: MIT
  license_file: docling_slim/LICENSE
  summary: Get your documents ready for gen AI
  description: >
    Docling simplifies document processing by parsing diverse formats, including 
    advanced PDF understanding — and providing seamless integrations with the 
    generative AI ecosystem.

extra:
  recipe-maintainers:
    - kklein
